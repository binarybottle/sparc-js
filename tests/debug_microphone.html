<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARC Microphone Debug</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #0f0;
        }
        .error { border-color: #f00; color: #f00; }
        .success { border-color: #0f0; color: #0f0; }
        .warning { border-color: #ff0; color: #ff0; }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            font-family: monospace;
            margin: 5px;
        }
        #waveform {
            width: 100%;
            height: 150px;
            background: #000;
            border: 1px solid #0f0;
            margin: 10px 0;
        }
        #log {
            background: #000;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            font-size: 12px;
            border: 1px solid #0f0;
        }
        .log-entry {
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <h1>🔬 SPARC Microphone Debug Tool</h1>
    
    <div class="status">
        <strong>Status:</strong> <span id="status">Idle</span>
    </div>
    
    <button onclick="startTest()">▶️ Start Microphone Test</button>
    <button onclick="stopTest()">⏹️ Stop</button>
    
    <h2>Audio Level</h2>
    <canvas id="waveform"></canvas>
    
    <h2>Diagnostic Info</h2>
    <div id="info" class="status"></div>
    
    <h2>Log</h2>
    <div id="log"></div>
    
    <script>
        let audioContext = null;
        let audioStream = null;
        let analyser = null;
        let source = null;
        let animationFrame = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.color = type === 'error' ? '#f00' : type === 'success' ? '#0f0' : type === 'warning' ? '#ff0' : '#0f0';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function updateInfo(key, value) {
            const infoDiv = document.getElementById('info');
            const id = `info-${key}`;
            let line = document.getElementById(id);
            if (!line) {
                line = document.createElement('div');
                line.id = id;
                infoDiv.appendChild(line);
            }
            line.textContent = `${key}: ${value}`;
        }
        
        async function startTest() {
            try {
                log('🎤 Requesting microphone access...', 'info');
                document.getElementById('status').textContent = 'Requesting microphone...';
                
                // Request microphone
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                log('✅ Microphone access granted', 'success');
                updateInfo('Microphone', 'Access granted');
                
                // Get audio track info
                const tracks = audioStream.getAudioTracks();
                if (tracks.length > 0) {
                    const track = tracks[0];
                    const settings = track.getSettings();
                    log(`📊 Microphone settings:`, 'info');
                    log(`  - Sample rate: ${settings.sampleRate || 'unknown'} Hz`, 'info');
                    log(`  - Channels: ${settings.channelCount || 'unknown'}`, 'info');
                    log(`  - Label: ${track.label}`, 'info');
                    
                    updateInfo('Sample Rate', `${settings.sampleRate || 'unknown'} Hz`);
                    updateInfo('Channels', settings.channelCount || 'unknown');
                    updateInfo('Device', track.label || 'Unknown');
                }
                
                // Create audio context
                log('🔧 Creating audio context...', 'info');
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });
                
                log(`✅ Audio context created: ${audioContext.sampleRate} Hz`, 'success');
                updateInfo('Audio Context', `${audioContext.sampleRate} Hz`);
                
                // Create analyser
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.8;
                
                // Connect audio stream
                source = audioContext.createMediaStreamSource(audioStream);
                source.connect(analyser);
                
                log('✅ Audio pipeline connected', 'success');
                document.getElementById('status').textContent = '🎤 Recording - Please speak!';
                
                // Start visualization
                visualize();
                
            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
                document.getElementById('status').textContent = `Error: ${error.message}`;
                console.error(error);
                
                if (error.name === 'NotAllowedError') {
                    log('⚠️  Microphone permission denied. Please allow microphone access.', 'error');
                } else if (error.name === 'NotFoundError') {
                    log('⚠️  No microphone found. Please connect a microphone.', 'error');
                }
            }
        }
        
        function visualize() {
            const canvas = document.getElementById('waveform');
            const ctx = canvas.getContext('2d');
            const width = canvas.width = canvas.offsetWidth;
            const height = canvas.height = canvas.offsetHeight;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            const timeArray = new Float32Array(bufferLength);
            
            function draw() {
                if (!analyser) return;
                
                animationFrame = requestAnimationFrame(draw);
                
                // Get frequency data
                analyser.getByteFrequencyData(dataArray);
                
                // Get time domain data
                analyser.getFloatTimeDomainData(timeArray);
                
                // Calculate RMS (audio level)
                let sum = 0;
                for (let i = 0; i < timeArray.length; i++) {
                    sum += timeArray[i] * timeArray[i];
                }
                const rms = Math.sqrt(sum / timeArray.length);
                const db = rms > 0 ? 20 * Math.log10(rms) : -100;
                
                // Calculate if audio is present
                const maxAmplitude = Math.max(...timeArray.map(Math.abs));
                const isAudioPresent = maxAmplitude > 0.01;
                
                // Update info
                updateInfo('RMS Level', `${rms.toFixed(4)} (${db.toFixed(1)} dB)`);
                updateInfo('Max Amplitude', maxAmplitude.toFixed(4));
                updateInfo('Audio Present', isAudioPresent ? '✅ YES' : '❌ NO');
                
                if (!isAudioPresent) {
                    updateInfo('⚠️ Warning', 'No audio detected - speak into microphone!');
                } else {
                    updateInfo('⚠️ Warning', '');
                }
                
                // Clear canvas
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, width, height);
                
                // Draw waveform
                ctx.lineWidth = 2;
                ctx.strokeStyle = isAudioPresent ? '#0f0' : '#f00';
                ctx.beginPath();
                
                const sliceWidth = width / bufferLength;
                let x = 0;
                
                for (let i = 0; i < bufferLength; i++) {
                    const v = timeArray[i];
                    const y = (v * height / 2) + (height / 2);
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                ctx.stroke();
                
                // Draw frequency bars
                const barWidth = width / bufferLength * 2;
                let barX = 0;
                
                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * height * 0.3;
                    
                    ctx.fillStyle = `rgb(0, ${dataArray[i]}, 0)`;
                    ctx.fillRect(barX, height - barHeight, barWidth, barHeight);
                    
                    barX += barWidth + 1;
                }
            }
            
            draw();
        }
        
        function stopTest() {
            log('⏹️ Stopping test...', 'info');
            
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            
            if (source) {
                source.disconnect();
                source = null;
            }
            
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            analyser = null;
            
            document.getElementById('status').textContent = 'Stopped';
            log('✅ Test stopped', 'success');
        }
        
        // Auto-start on load
        window.addEventListener('load', () => {
            log('🚀 Debug tool ready. Click "Start Microphone Test" to begin.', 'info');
        });
    </script>
</body>
</html>
