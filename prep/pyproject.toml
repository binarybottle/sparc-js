[tool.poetry]
name = "sparc-js-prep"
version = "0.1.0"
description = "Preprocessing scripts for SPARC-JS"
authors = ["Your Name"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
torch = "^2.9.1"
transformers = "^4.40.0"
onnx = "^1.16.0"
onnxruntime = "^1.18.0"
scipy = "^1.13.0"
numpy = "^2.1.0"
soundfile = "^0.12.1"

# Note: onnxruntime-extensions is needed for quantization but may not have
# wheels for all platforms. Install manually if needed: pip install onnxruntime-extensions
# [tool.poetry.group.dev.dependencies]
# onnxruntime-extensions = "^0.12.0"
onnxscript = "^0.5.6"
librosa = "^0.11.0"
scikit-learn = "^1.7.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
